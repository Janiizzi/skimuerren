services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - RAFFLES_STORAGE_PATH=/app/data/raffles.json
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
